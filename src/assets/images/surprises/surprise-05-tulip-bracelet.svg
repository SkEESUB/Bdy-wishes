<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <radialGradient id="tulipBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FFF3F6"/>
      <stop offset="60%" stop-color="#FEE0E9"/>
      <stop offset="100%" stop-color="#FCC7D7"/>
    </radialGradient>
    <linearGradient id="roseGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE3D4"/>
      <stop offset="50%" stop-color="#EAA68A"/>
      <stop offset="100%" stop-color="#C27357"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#tulipBg)"/>
  <circle cx="300" cy="225" r="170" fill="#FFFFFF" opacity="0.6"/>

  <g transform="translate(300, 220)">
    <!-- Bracelet chain loop -->
    <ellipse cx="0" cy="0" rx="140" ry="85" fill="none" stroke="url(#roseGold)" stroke-width="7"/>

    <!-- Small beaded links along bracelet -->
    <circle cx="-130" cy="31.548068280718834" r="5" fill="#FFFFFF" stroke="#EAA68A" stroke-width="2"/><circle cx="-90" cy="65.10881786106475" r="5" fill="#FFFFFF" stroke="#EAA68A" stroke-width="2"/><circle cx="-45" cy="80.48937532877446" r="5" fill="#FFFFFF" stroke="#EAA68A" stroke-width="2"/><circle cx="0" cy="85" r="5" fill="#FFFFFF" stroke="#EAA68A" stroke-width="2"/><circle cx="45" cy="80.48937532877446" r="5" fill="#FFFFFF" stroke="#EAA68A" stroke-width="2"/><circle cx="90" cy="65.10881786106475" r="5" fill="#FFFFFF" stroke="#EAA68A" stroke-width="2"/><circle cx="130" cy="31.548068280718834" r="5" fill="#FFFFFF" stroke="#EAA68A" stroke-width="2"/>
    <circle cx="-110" cy="-52.58011380119806" r="4" fill="#FFFFFF" stroke="#EAA68A" stroke-width="2"/><circle cx="-65" cy="-75.28326608922613" r="4" fill="#FFFFFF" stroke="#EAA68A" stroke-width="2"/><circle cx="-20" cy="-84.12818208191689" r="4" fill="#FFFFFF" stroke="#EAA68A" stroke-width="2"/><circle cx="25" cy="-83.63379083473232" r="4" fill="#FFFFFF" stroke="#EAA68A" stroke-width="2"/><circle cx="70" cy="-73.61215932167728" r="4" fill="#FFFFFF" stroke="#EAA68A" stroke-width="2"/><circle cx="110" cy="-52.58011380119806" r="4" fill="#FFFFFF" stroke="#EAA68A" stroke-width="2"/>

    <!-- Center Tulip Charm -->
    <g transform="translate(0, 85)">
      <circle cx="0" cy="0" r="6" fill="url(#roseGold)"/>
      <line x1="0" y1="0" x2="0" y2="18" stroke="url(#roseGold)" stroke-width="4"/>
      <!-- Tulip petals -->
      <path d="M 0 20 C -22 22, -26 48, -12 60 C 0 70, 0 70, 0 70 C 0 70, 0 70, 12 60 C 26 48, 22 22, 0 20 Z" fill="#FF789E"/>
      <path d="M 0 25 C -12 28, -15 48, 0 65 C 15 48, 12 28, 0 25 Z" fill="#FF4D7E"/>
      <ellipse cx="0" cy="38" rx="6" ry="14" fill="#FFA5C0"/>
      <!-- Tiny stem leaf -->
      <path d="M 0 68 Q -10 74 -16 70" stroke="#68A362" stroke-width="3" fill="none"/>
    </g>

    <!-- Side Little Flower Charms -->
    <g transform="translate(-75, 70)">
      <circle cx="0" cy="18" r="10" fill="#FFF" stroke="#EAA68A" stroke-width="2"/>
      <circle cx="0" cy="18" r="4" fill="#FFB8CE"/>
    </g>
    <g transform="translate(75, 70)">
      <circle cx="0" cy="18" r="10" fill="#FFF" stroke="#EAA68A" stroke-width="2"/>
      <circle cx="0" cy="18" r="4" fill="#FFB8CE"/>
    </g>
  </g>
</svg>